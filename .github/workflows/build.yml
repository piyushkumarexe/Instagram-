name: Android APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: Build native APK (Kotlin)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Build debug APK (Kotlin / Jetpack Compose)
        run: |
          cd android
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/gradle.log

      - name: Surface compile errors
        if: failure()
        run: |
          if [ -f /tmp/gradle.log ]; then
            grep -E "^e: |error:|FAILURE:" /tmp/gradle.log | head -40 | while IFS= read -r line; do
              echo "::error::${line:0:400}"
            done
            echo "---- last 40 lines ----"
            tail -40 /tmp/gradle.log
          fi

      - name: Report signing SHA-1 (for Firebase console)
        run: |
          SHA1=$(openssl pkcs12 -in android/keystore/vibegram-debug.keystore -passin pass:vibegram123 -nokeys 2>/dev/null | openssl x509 -fingerprint -sha1 -noout | sed 's/.*=//')
          {
            echo "### 🔑 Instagram 2.0 native (Kotlin) build"
            echo "Signing SHA-1: ${SHA1}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Instagram2-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          NOTES=/tmp/notes.md
          {
            echo "Instagram 2.0 ${TAG} — native Kotlin app."
            echo ""
            echo "## 📥 Download"
            echo "- 🤖 **Android APK:** app-debug.apk (below)"
          } > "$NOTES"
          for i in 1 2 3 4 5 6; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "$APK" --clobber && gh release edit "$TAG" --notes-file "$NOTES" || true
              exit 0
            fi
            sleep 15
          done
          gh release create "$TAG" "$APK" -t "Instagram 2.0 $TAG" --notes-file "$NOTES" || gh release upload "$TAG" "$APK" --clobber
