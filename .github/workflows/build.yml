name: Build Apps

on:
  push:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: 🤖 Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Audit imports (prevent runtime crashes)
        run: node scripts/audit-imports.mjs

      - name: Build web app
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log
          if grep -i "is not exported by" /tmp/build.log; then
            echo "::error::Missing module exports detected — app would crash at runtime"
            exit 1
          fi
          for s in "vibegram-ff651" "Continue with Google"; do
            grep -rq "$s" client/dist/assets/ || { echo "::error::bundle missing: $s"; exit 1; }
          done
          if grep -rqi "try the demo" client/dist/assets/; then
            echo "::error::bundle contains placeholder wording"
            exit 1
          fi
          echo "bundle smoke checks passed"

      - name: Sync Capacitor (web assets -> Android)
        continue-on-error: true
        run: |
          npx cap sync android > /tmp/sync.log 2>&1 || {
            MSG=$(tail -c 700 /tmp/sync.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::cap sync failed: $MSG"
            exit 1
          }

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Report signing SHA-1 (for Firebase console)
        run: |
          SHA1=$(openssl pkcs12 -in android/keystore/vibegram-debug.keystore -passin pass:vibegram123 -nokeys 2>/dev/null | openssl x509 -fingerprint -sha1 -noout | sed 's/.*=//')
          {
            echo "### 🔑 Add this SHA-1 in Firebase Console"
            echo ""
            echo "Firebase Console → Project settings → Your apps → Android app → Add fingerprint:"
            echo ""
            echo '```'
            echo "$SHA1"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "SHA1=$SHA1" >> "$GITHUB_ENV"
          echo "APK signing SHA-1: $SHA1"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeGram-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          NOTES=/tmp/notes.md
          {
            echo "Automated build from commit ${GITHUB_SHA::7}."
            echo ""
            echo "## 📥 Downloads"
            echo "- 🤖 **Android APK:** app-debug.apk (below)"
            echo "- 🍎 **iOS IPA:** VibeGram-iOS-unsigned.ipa (below — needs Apple ID via AltStore/Sideloadly)"
            echo ""
            echo "## 🔑 Google Sign-In setup (one time, 2 minutes)"
            echo "1. Open Firebase Console → project **vibegram-ff651**"
            echo "2. ⚙️ Project settings → **Your apps** → Android app \`com.vibegram.app\`"
            echo "3. **Add fingerprint** and paste:"
            echo ""
            echo '```'
            echo "${SHA1}"
            echo '```'
            echo ""
            echo "4. Save → reinstall this APK → “Continue with Google” opens the in-app account picker ✅"
          } > "$NOTES"
          for i in 1 2 3 4 5 6; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" "$APK" --clobber && gh release edit "$TAG" --notes-file "$NOTES" || true
              exit 0
            fi
            sleep 15
          done
          gh release create "$TAG" "$APK" -t "VibeGram $TAG" --notes-file "$NOTES" || gh release upload "$TAG" "$APK" --clobber

  ipa:
    name: 🍎 iOS IPA (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit imports (prevent runtime crashes)
        run: node scripts/audit-imports.mjs

      - name: Build web app
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log
          if grep -i "is not exported by" /tmp/build.log; then
            echo "::error::Missing module exports detected — app would crash at runtime"
            exit 1
          fi
          echo "web build ok"

      - name: Sync Capacitor (web assets -> iOS)
        run: npx cap sync ios

      - name: Build unsigned IPA
        run: |
          cd ios
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -sdk iphoneos -derivedDataPath build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r ../VibeGram-iOS-unsigned.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeGram-iOS-unsigned
          path: VibeGram-iOS-unsigned.ipa
          if-no-files-found: error

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          for i in 1 2 3 4 5 6 7 8; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" VibeGram-iOS-unsigned.ipa --clobber || true
              exit 0
            fi
            sleep 15
          done
          gh release create "$TAG" VibeGram-iOS-unsigned.ipa -t "VibeGram $TAG" --generate-notes || gh release upload "$TAG" VibeGram-iOS-unsigned.ipa --clobber
