name: Android APK

on:
  push:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log
          # fail on missing-export warnings (silent runtime killers)
          if grep -i "is not exported by" /tmp/build.log; then
            echo "::error::Missing module exports detected — app would crash at runtime"
            exit 1
          fi
          # smoke-check critical strings actually made it into the bundle
          for s in "isNativePlatform" "Try the demo account" "VibeGram server URL"; do
            grep -rq "$s" client/dist/assets/ || { echo "::error::bundle missing: $s"; exit 1; }
          done
          echo "bundle smoke checks passed"
        env:
          # Default backend for the APK (auto-connect, no manual setup).
          VITE_DEFAULT_SERVER: ${{ vars.VITE_DEFAULT_SERVER || 'https://3001-i3qpv1k7t5a8gqf1z83i3.e2b.app' }}

      - name: Sync Capacitor (web assets -> Android)
        continue-on-error: true
        run: |
          npx cap sync android > /tmp/sync.log 2>&1 || {
            MSG=$(tail -c 700 /tmp/sync.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::cap sync failed: $MSG"
            exit 1
          }

      - name: Assemble debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeGram-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: VibeGram ${{ github.ref_name }}
