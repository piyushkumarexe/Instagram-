name: iOS IPA

on:
  push:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  ipa:
    name: Build iOS IPA (unsigned)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web app
        run: |
          set -o pipefail
          npm run build 2>&1 | tee /tmp/build.log
          if grep -i "is not exported by" /tmp/build.log; then
            echo "::error::Missing module exports detected"
            exit 1
          fi
          for s in "vibegram-ff651" "Continue with Google"; do
            grep -rq "$s" client/dist/assets/ || { echo "::error::bundle missing: $s"; exit 1; }
          done
          if grep -rqi "try the demo" client/dist/assets/; then
            echo "::error::bundle contains placeholder wording"
            exit 1
          fi

      - name: Sync Capacitor (web assets -> iOS)
        continue-on-error: true
        run: |
          npx cap sync ios > /tmp/sync.log 2>&1 || {
            MSG=$(tail -c 700 /tmp/sync.log | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error::cap sync ios failed: $MSG"
            exit 1
          }

      - name: Build unsigned IPA
        run: |
          set -e
          cd ios/App
          mkdir -p ../../build
          # Archive with signing disabled (no certificates in CI)
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ../../build/App.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
            -skipPackagePluginValidation -quiet || \
          { echo "::warning::archive failed, trying target build"; \
            xcodebuild -project App.xcodeproj \
              -target App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              SYMROOT=../../build/Build \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY= \
              -skipPackagePluginValidation -quiet; }

          APP_PATH=$(find ../../build -type d -name "*.app" | head -1)
          if [ -z "$APP_PATH" ]; then echo "::error::built .app not found"; exit 1; fi
          echo "found app: $APP_PATH"

          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry VibeGram-iOS-unsigned.ipa Payload
          mkdir -p /tmp/out
          mv VibeGram-iOS-unsigned.ipa /tmp/out/
          echo "IPA ready"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeGram-iOS-unsigned
          path: /tmp/out/VibeGram-iOS-unsigned.ipa
          if-no-files-found: error

      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          for i in 1 2 3 4 5 6; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" /tmp/out/VibeGram-iOS-unsigned.ipa --clobber && exit 0
            fi
            sleep 15
          done
          gh release create "$TAG" /tmp/out/VibeGram-iOS-unsigned.ipa -t "VibeGram $TAG" --notes "Automated build" || gh release upload "$TAG" /tmp/out/VibeGram-iOS-unsigned.ipa --clobber
