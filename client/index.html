<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>VibeGram</title>
    <link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin />
    <link rel="preconnect" href="https://firebasestorage.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
    <style>
      /* pre-React boot loader — no more blank white screen */
      #boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px; background: #fff;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #boot img { width: 72px; height: 72px; border-radius: 16px; }
      #boot p { color: #8e8e8e; font-weight: 600; font-size: 14px; margin: 0; }
      #boot .bar { width: 120px; height: 3px; background: #eee; border-radius: 2px; overflow: hidden; }
      #boot .bar span { display: block; height: 100%; width: 40%; background: linear-gradient(90deg,#f09433,#dc2743,#bc1888); animation: slide 1.1s ease-in-out infinite; }
      @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(320%); } }
    </style>
  </head>
  <body>
    <div id="boot">
      <img src="/logo.png" alt="VibeGram" />
      <p>Loading VibeGram…</p>
      <div class="bar"><span></span></div>
    </div>
    <div id="root"></div>
    <script>
      // watchdog: if React hasn't mounted in 12s, turn the boot screen into a diagnostic
      setTimeout(function () {
        try {
          var r = document.getElementById('root')
          var b = document.getElementById('boot')
          if (b && (!r || r.childElementCount === 0)) {
            var logs = ''
            try { logs = window.__vgLogs ? window.__vgLogs() : '' } catch (e) {}
            var d = document.createElement('div')
            d.style.cssText = 'max-width:340px;text-align:left;font-size:12px;color:#8e8e8e;white-space:pre-wrap;overflow:auto;max-height:45vh;margin-top:6px'
            d.textContent = 'App load hone mein zyada time lag raha hai. Internet check karke Reload karo.' + (logs ? '\n\nDetails:\n' + logs : '')
            b.appendChild(d)
          }
        } catch (e) {}
      }, 12000)
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
