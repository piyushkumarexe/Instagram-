plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.vibegram.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.vibegram.app'
        minSdk 26
        targetSdk 34
        versionCode 41
        versionName '5.9'
    }

    signingConfigs {
        vibegram {
            storeFile file('../keystore/vibegram-debug.keystore')
            storePassword 'vibegram123'
            keyAlias 'vibegram'
            keyPassword 'vibegram123'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.vibegram
        }
        release {
            signingConfig signingConfigs.vibegram
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    buildFeatures {
        compose true
    }
    packagingOptions {
        resources {
            excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }
}

dependencies {
    // Firebase (same backend as before)
    implementation platform('com.google.firebase:firebase-bom:33.3.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.8.1'

    // AndroidX + Compose
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.6'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation platform('androidx.compose:compose-bom:2024.09.02')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3:1.3.0'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'io.coil-kt:coil-compose:2.6.0'

    // Native Google Sign-In (account picker inside the app)
    implementation 'androidx.credentials:credentials:1.2.2'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'androidx.credentials:credentials-play-services-auth:1.2.2'
    implementation 'com.google.android.libraries.identity.googleid:googleid:1.1.1'
}
